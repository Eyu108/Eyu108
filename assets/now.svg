<circle cx="32" cy="26" r="6.5" fill="#FF5F57"/><circle cx="54" cy="26" r="6.5" fill="#FEBC2E"/><circle cx="76" cy="26" r="6.5" fill="#28C840"/>
<text class="mono" x="600.0" y="31" font-size="13" fill="#8B98AA" text-anchor="middle" letter-spacing="1">eli@calgary — ~/now — zsh</text>
<g class="ln" style="animation-delay:0.30s"><text class="mono" x="44" y="104" font-size="16"><tspan fill="#34D399">➜</tspan><tspan fill="#A78BFA">  ~</tspan><tspan fill="#EEF2F7">  whoami --short</tspan></text></g><g class="ln" style="animation-delay:0.62s"><text class="mono" x="70" y="134" font-size="16"><tspan fill="#C3CCD8">CS @ University of Calgary</tspan><tspan fill="#4E5968">  ·  </tspan><tspan fill="#C3CCD8">software + data + markets</tspan></text></g><g class="ln" style="animation-delay:0.94s"><text class="mono" x="44" y="174" font-size="16"><tspan fill="#34D399">➜</tspan><tspan fill="#A78BFA">  ~</tspan><tspan fill="#EEF2F7">  ls ~/building</tspan></text></g><g class="ln" style="animation-delay:1.26s"><text class="mono" x="70" y="204" font-size="16"><tspan fill="#5EEAD4">▸ ai-receptionist</tspan></text><text x="300" y="204" font-size="16" fill="#8B98AA">voice + SMS agent that answers calls and books appointments for small businesses</text></g><g class="ln" style="animation-delay:1.58s"><text class="mono" x="70" y="234" font-size="16"><tspan fill="#5EEAD4">▸ prediction-bot</tspan></text><text x="300" y="234" font-size="16" fill="#8B98AA">15-minute BTC prediction-market trading system, hybrid signals + risk limits</text></g><g class="ln" style="animation-delay:1.90s"><text class="mono" x="70" y="264" font-size="16"><tspan fill="#5EEAD4">▸ nq-indicator</tspan></text><text x="300" y="264" font-size="16" fill="#8B98AA">TradingView indicator &amp; strategy for NQ futures, validated with a Python backtester</text></g><g class="ln" style="animation-delay:2.22s"><text class="mono" x="44" y="304" font-size="16"><tspan fill="#34D399">➜</tspan><tspan fill="#A78BFA">  ~</tspan><tspan fill="#EEF2F7">  echo $GOAL</tspan></text></g><g class="ln" style="animation-delay:2.54s"><text class="mono" x="70" y="334" font-size="16"><tspan fill="#5EEAD4">ship things people actually use</tspan></text></g>
<rect class="cur" x="368" y="319" width="10" height="19" fill="#5EEAD4"/>
</g>
<rect x=".5" y=".5" width="1199" height="371" rx="21.5" stroke="#FFFFFF" stroke-opacity="0.08"/>
