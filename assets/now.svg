<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="372" viewBox="0 0 1200 372" fill="none" role="img" aria-label="Now building: AI receptionist, prediction-market trading bot, NQ futures indicator">
<title>Now building: AI receptionist, prediction-market trading bot, NQ futures indicator</title>
<style>
text{font-family:'Inter','Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
.mono{font-family:'JetBrains Mono','SF Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
.ln{opacity:0;animation:ln .45s ease-out forwards}
@keyframes ln{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
.cur{opacity:0;animation:on 0s 2.86s forwards, blink 1s 2.86s steps(1) infinite}
@keyframes on{to{opacity:1}}
@keyframes blink{50%{opacity:0}}
</style>
<defs>
<pattern id="gridn" width="40" height="40" patternUnits="userSpaceOnUse">
  <path d="M40 0H0V40" stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="1"/>
</pattern>
<radialGradient id="glowVn" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(160 40) rotate(35) scale(620 360)">
  <stop stop-color="#A78BFA" stop-opacity="0.22"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
</radialGradient>
<radialGradient id="glowCn" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(980 420) rotate(-20) scale(560 320)">
  <stop stop-color="#5EEAD4" stop-opacity="0.16"/><stop offset="1" stop-color="#5EEAD4" stop-opacity="0"/>
</radialGradient><clipPath id="c"><rect width="1200" height="372" rx="22"/></clipPath></defs>
<g clip-path="url(#c)">
<rect width="1200" height="372" fill="#0B0F16"/>
