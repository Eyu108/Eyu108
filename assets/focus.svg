<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" fill="none" role="img" aria-label="Focus: energy &amp; finance, software engineering, research &amp; AI">
<title>Focus: energy &amp; finance, software engineering, research &amp; AI</title>
<style>
