<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="84" viewBox="0 0 1200 84" fill="none" role="img" aria-label="Selected work">
<title>Selected work</title>
<style>
text{font-family:'Inter','Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
.mono{font-family:'JetBrains Mono','SF Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
.grow{transform-origin:left;transform:scaleX(0);animation:grow 1.4s .2s cubic-bezier(.2,.8,.2,1) forwards}
